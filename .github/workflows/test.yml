name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          bb: 1.12.218
      - run: bb test
      - run: bb check-profiles
      - name: fixture run matches the recorded evidence
        run: bb fixture-run | diff - docs/evidence/jp-address-change-fixture-run.edn
  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.12.0.1530
          bb: 1.12.218
      - name: guest bundle matches the committed artifact
        run: |
          bb guest
          git diff --exit-code dist/
